<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>組織学実習資料｜神戸常盤大学 医療検査学科</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    background: #f8fafc; color: #1e293b; min-height: 100vh;
    padding: 40px 16px;
  }
  .container { max-width: 720px; margin: 0 auto; }

  .header { margin-bottom: 40px; }
  .header-label {
    font-size: 11px; font-weight: 700; letter-spacing: 3px;
    color: #94a3b8; text-transform: uppercase; margin-bottom: 8px;
  }
  .header h1 { font-size: 26px; font-weight: 800; color: #0f172a; line-height: 1.3; }
  .header p { font-size: 13px; color: #64748b; margin-top: 8px; }

  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 2px;
    color: #94a3b8; text-transform: uppercase; margin-bottom: 12px;
  }

  .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 32px; }

  .card {
    display: block; text-decoration: none;
    background: #fff; border-radius: 14px; border: 1.5px solid #e2e8f0;
    padding: 20px; cursor: pointer; transition: all .15s;
  }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px #00000012; }

  .card-icon { font-size: 28px; margin-bottom: 12px; }
  .card-title { font-size: 16px; font-weight: 800; margin-bottom: 4px; }
  .card-sub { font-size: 11px; color: #94a3b8; font-style: italic; margin-bottom: 10px; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .tag {
    font-size: 10px; font-weight: 600; padding: 2px 8px;
    border-radius: 20px;
  }

  .card-reproductive { border-color: #e879f9; }
  .card-reproductive:hover { box-shadow: 0 8px 24px #c026d322; }
  .card-reproductive .card-title { color: #701a75; }
  .card-reproductive .tag { background: #fae8ff; color: #701a75; }

  .card-digestive { border-color: #6ee7b7; }
  .card-digestive:hover { box-shadow: 0 8px 24px #10b98122; }
  .card-digestive .card-title { color: #065f46; }
  .card-digestive .tag { background: #d1fae5; color: #065f46; }

  .card-coming {
    border-color: #e2e8f0; opacity: 0.5; cursor: default; pointer-events: none;
  }
  .card-coming .card-title { color: #94a3b8; }
  .card-coming .tag { background: #f1f5f9; color: #94a3b8; }

  .footer { text-align: center; font-size: 11px; color: #cbd5e1; margin-top: 40px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="header-label">Histology Reference</div>
    <h1>組織学実習資料</h1>
    <p>臨床検査技師国家試験対応・医療検査学科</p>
  </div>

  <div class="section-label">系統を選択</div>
  <div class="card-grid">
    <a class="card card-reproductive" href="reproductive.html">
      <div class="card-icon">🔬</div>
      <div class="card-title">生殖器</div>
      <div class="card-sub">Reproductive System</div>
      <div class="card-tags">
        <span class="tag">女性生殖器</span>
        <span class="tag">男性生殖器</span>
      </div>
    </a>
    <a class="card card-digestive" href="digestive.html">
      <div class="card-icon">🔬</div>
      <div class="card-title">消化器</div>
      <div class="card-sub">Digestive System</div>
      <div class="card-tags">
        <span class="tag">唾液腺</span>
        <span class="tag">消化管</span>
      </div>
    </a>
    <div class="card card-coming">
      <div class="card-icon">🔬</div>
      <div class="card-title">泌尿器</div>
      <div class="card-sub">Urinary System</div>
      <div class="card-tags"><span class="tag">準備中</span></div>
    </div>
    <div class="card card-coming">
      <div class="card-icon">🔬</div>
      <div class="card-title">循環器</div>
      <div class="card-sub">Cardiovascular System</div>
      <div class="card-tags"><span class="tag">準備中</span></div>
    </div>
  </div>

  <div class="footer">臨床検査学科 組織学実習資料</div>
</div>
</body>
</html>
